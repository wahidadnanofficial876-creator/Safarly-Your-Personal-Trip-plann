<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign In to Safarly</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    padding: 40px 20px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: #ffffff;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 40px rgba(17, 24, 39, 0.08);
  }

  .icon-badge {
    width: 56px;
    height: 56px;
    background: #e4e3ff;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }

  .icon-badge svg {
    width: 26px;
    height: 26px;
    stroke: #5b4fe8;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    color: #111827;
    margin: 0 0 8px;
  }

  .subtitle {
    font-size: 14px;
    color: #9ca3af;
    margin: 0 0 28px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #1f2937;
    margin-bottom: 8px;
  }

  .input-wrap {
    position: relative;
  }

  .input-wrap svg.icon-left {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: #9ca3af;
    pointer-events: none;
  }

  .input-wrap input {
    width: 100%;
    padding: 13px 16px 13px 42px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14.5px;
    color: #111827;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-wrap input::placeholder {
    color: #b0b4bb;
  }

  .input-wrap input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }

  .input-wrap .toggle-eye {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: #9ca3af;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }

  .options-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 0 26px;
  }

  .remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .remember-me input[type="checkbox"] {
    width: 17px;
    height: 17px;
    accent-color: #5b4fe8;
    border-radius: 4px;
    cursor: pointer;
  }

  .remember-me label {
    font-size: 13.5px;
    color: #9ca3af;
    cursor: pointer;
  }

  .options-row a {
    font-size: 13.5px;
    color: #5b4fe8;
    font-weight: 600;
    text-decoration: none;
  }

  .options-row a:hover {
    text-decoration: underline;
  }

  .btn-submit {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #6a5cf5 0%, #4338ca 100%);
    color: #ffffff;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 6px 16px rgba(79, 70, 229, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
  }

  .btn-submit:active {
    transform: translateY(0);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e5e7eb;
  }

  .divider span {
    font-size: 13px;
    color: #b0b4bb;
  }

  .btn-social {
    width: 100%;
    padding: 13px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    background: #ffffff;
    color: #374151;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .btn-social:hover {
    background: #f9fafb;
    border-color: #d1d5db;
  }

  .footer-text {
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
    color: #9ca3af;
  }

  .footer-text a {
    color: #5b4fe8;
    font-weight: 700;
    text-decoration: none;
  }

  .footer-text a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="10" rx="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
  </div>

  <h1>Welcome Back</h1>
  <p class="subtitle">Sign in to continue managing your trips</p>

  <div class="field">
    <label for="email">Email Address</label>
    <div class="input-wrap">
      <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
        <path d="m2 6 10 7 10-7"></path>
      </svg>
      <input id="email" type="email" placeholder="john@example.com">
    </div>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="input-wrap">
      <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <input id="password" type="password" placeholder="••••••••">
      <button type="button" class="toggle-eye" aria-label="Show password" onclick="togglePw('password', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
  </div>

  <div class="options-row">
    <div class="remember-me">
      <input type="checkbox" id="remember">
      <label for="remember">Remember me</label>
    </div>
    <a href="#">Forgot password?</a>
  </div>

  <button class="btn-submit" type="button">
    Sign In
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M13 6l6 6-6 6"></path>
    </svg>
  </button>

  <div class="divider"><span>OR</span></div>

  <button class="btn-social" type="button">
    <svg width="18" height="18" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47c-.28 1.5-1.13 2.78-2.4 3.63v3.01h3.88c2.27-2.09 3.57-5.17 3.57-8.83z"/>
      <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.88-3.01c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.26v3.11C3.24 21.3 7.29 24 12 24z"/>
      <path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.37-2.28V6.61H1.26A11.98 11.98 0 0 0 0 12c0 1.94.46 3.77 1.26 5.39l4.01-3.11z"/>
      <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.29 0 3.24 2.7 1.26 6.61l4.01 3.11C6.22 6.86 8.87 4.75 12 4.75z"/>
    </svg>
    Continue with Google
  </button>

  <p class="footer-text">Don't have an account? <a href="#">Sign up</a></p>
</div>



</body>
</html>
