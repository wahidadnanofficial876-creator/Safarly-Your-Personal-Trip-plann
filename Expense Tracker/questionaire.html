<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/CSS/questionaire.css">
    <title>Document</title>
</head>
<body>

<div class="background"></div>

<div class="card">

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <span class="step" id="question-number">Question 1 of 2</span>

    <h1 id="currentQuestion">Total Trip Budget?</h1>

    <p id="para">
        This helps us calculate remaining budget and
        spending insights.
    </p>

    <input
        type="text"
        placeholder="Enter budget" id="input">
        

    <div class="buttons">


        <button class="primary" id="continue-btn">
            Continue →
        </button>
        
    </div>

</div>

</body>
<script src="assets/JS/questionaire.js"></script>
</html>
